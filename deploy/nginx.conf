server {
  listen 80;
  server_name jonlix.uz www.jonlix.uz;
  root /var/www/jonlix;
  index index.html;

  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; media-src 'self' https:; style-src 'self'; font-src 'self'; script-src 'self' https://www.googletagmanager.com https://mc.yandex.ru https://connect.facebook.net; connect-src 'self' https://api.jonlix.uz https://www.google-analytics.com https://mc.yandex.ru https://www.facebook.com; frame-src https://www.facebook.com" always;
}

server {
  listen 80;
  server_name api.jonlix.uz;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
